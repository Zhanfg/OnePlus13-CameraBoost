name: Android hook APK

on:
  push:
    paths:
      - "android-hook/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-hook.yml"
  pull_request:
    paths:
      - "android-hook/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-hook.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Android SDK manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "Using $SDKMANAGER"

      - name: Accept Android SDK licenses
        run: yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses >/dev/null || true

      - name: Install Android SDK
        run: "${{ steps.sdk.outputs.sdkmanager }}" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build probe and 10-bit variants
        run: gradle :android-hook:assembleProbe :android-hook:assembleEnable10bit --stacktrace

      - name: Stage APKs
        run: |
          mkdir -p out
          cp android-hook/build/outputs/apk/probe/android-hook-probe.apk out/CameraBoost-10bit-probe.apk
          cp android-hook/build/outputs/apk/enable10bit/android-hook-enable10bit.apk out/CameraBoost-10bit-enable.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CameraBoost-10bit-apks
          path: out/
